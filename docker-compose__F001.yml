version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_vector_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=rag_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:.
    volumes:
      -.:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://admin:secret@db:5432/rag_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
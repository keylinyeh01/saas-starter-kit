name: SaaS CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # 1. 啟動所有服務
    - name: Start containers
      run: docker compose up -d --build

    # 2. 等待 30 秒 (這時候資料庫正在慢慢初始化，App 可能會先崩潰，沒關係)
    - name: Wait for services
      run: sleep 30

    # 3. 【關鍵修正】重啟 App
    # 因為資料庫現在應該好了，我們把剛剛撞牆死掉的 App 叫醒，叫它再連一次
    - name: Restart Node App
      run: docker compose restart app

    # 4. 再等個 5 秒讓 App 連線
    - name: Wait for App restart
      run: sleep 5

    # 5. 印出 Log (萬一又失敗，方便我們除錯)
    - name: Show logs
      run: |
        docker compose ps
        docker compose logs

    # 6. 測試
    - name: Test Homepage
      run: |
        echo "Testing endpoint..."
        curl --fail http://localhost:3000 || exit 1

    # 4. 測試 (更新版：加入文檔檢查)
    - name: Test Endpoints
      run: |
        echo "Testing Homepage..."
        curl --fail http://localhost:3000 || exit 1
        
        echo "Testing Documentation..."
    # -L 代表自動跟隨轉址 (因為 /api-docs 有時會跳轉到 /api-docs/)
        curl --fail -L http://localhost:3000/api-docs/ || exit 1

    # 7. 清理
    - name: Stop containers
      run: docker compose down
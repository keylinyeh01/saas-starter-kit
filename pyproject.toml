[tool.poetry]
name = "enterprise-rag-pipeline"
version = "0.1.0"
description = "High-precision RAG pipeline with Hybrid Retrieval and Re-ranking"
authors = ["pengboyeh <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
langchain = "^0.1.0"
langchain-openai = "^0.1.0"
langchain-postgres = "^0.0.3"
psycopg = {extras = ["binary", "pool"], version = "^3.1.18"}
rank_bm25 = "^0.2.2"
sentence-transformers = "^2.6.0"
torch = "^2.2.0"
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ragas = "^0.1.0"
testcontainers = "^3.7.1"  # 用於集成測試

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
version: '3.8'

services:
  # 1. 中央發電機：PostgreSQL 資料庫
  db:
    image: postgres:15-alpine
    container_name: saas_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: saas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. 快取與限流閥：Redis
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. 大樓主體：Node.js App
  app:
    build: .
    container_name: saas_backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://admin:password123@db:5432/saas_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    command: node index.js

volumes:
  postgres_data: 
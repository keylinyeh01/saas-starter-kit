version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nexus_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data

# --- 你原本缺的就是下面這一段 ---
volumes:
  postgres_data: